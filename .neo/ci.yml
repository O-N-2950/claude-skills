name: Sealed artifact utility checks
on:
  pull_request:
jobs:
  artifact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/deliver -p 'test_*.py' -v
